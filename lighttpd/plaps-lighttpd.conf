# plaps — reverse proxy vhost (shape verified against lighttpd 1.4.85;
# see docs/spikes/lighttpd-sendfile.md).
#
# Auth terminates entirely here (digest, reusing the server's existing
# htdigest userfile and realm); the app ships no auth code by design. The
# JSON API is consumable by a future Android client with the same credentials.
#
# Install: include this file from the main lighttpd config, e.g.
#     include "/etc/lighttpd/vhosts.d/plaps-lighttpd.conf"
# then `lighttpd -tt -f /etc/lighttpd/lighttpd.conf` and restart lighttpd.
# The docroot must point at the repo's static/ directory — a symlink works:
#     ln -s /opt/plaps/static /srv/http/plaps
# Dev-time variant: replace the document-root with the repo checkout itself.

$HTTP["host"] == "photos.dory.moe" {
    server.document-root = "/srv/http/plaps"

    # /api, /media, and /original stream from the app on localhost
    $HTTP["url"] =~ "^/(api|media|original)/" {
        proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 8096 ) ) )
    }

    # The only auth layer: covers static files and proxied paths alike.
    auth.require = ( "" => (
        "method"  => "digest",
        "realm"   => "General",
        "require" => "valid-user"
    ) )

    # TLS is required before any exposure past the LAN (design, Security).
    # Obtain a certificate covering this name first, then uncomment:
    # $SERVER["socket"] == ":443" {
    #     ssl.engine  = "enable"
    #     ssl.pemfile = "/etc/letsencrypt/live/photos.dory.moe/fullchain.pem"
    #     ssl.privkey = "/etc/letsencrypt/live/photos.dory.moe/privkey.pem"
    # }
}
