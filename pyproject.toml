[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plaps"
version = "0.1.0"
description = "Single-user, self-hosted on-disk photo gallery"
requires-python = ">=3.11"
dependencies = [
    "flask",
    "waitress",
    "pyvips",
    "piexif",
    "httpx",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["plaps*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["SIM108", "SIM105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
